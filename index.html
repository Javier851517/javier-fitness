<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#df6265"><link rel="manifest" href="manifest.json"><title>Javier Fitness</title><style>body{font-family:-apple-system,system-ui;margin:0;background:#f5f6f8;color:#20242b}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}button{border:0;border-radius:12px;background:#df6265;color:white;padding:12px;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap}.muted{color:#747b86;font-size:13px}input{width:64px;padding:8px;border:1px solid #ddd;border-radius:8px}</style></head><body><div class="wrap"><h1>Javier Fitness</h1><p class="muted">Semana 1 · 5 sesiones · objetivo RIR 2-3</p><div class="tabs" id="tabs"></div><div id="list"></div></div><script>
const days=[['Empujes',[['Press de banca',40,'3×10-12'],['Press pecho máquina','Actual','3×10-12'],['Press hombro','Actual','3×10-12'],['Elevaciones laterales','Actual','3×12-15'],['Extensión tríceps polea','Actual','3×12-15']]],['Pierna · cuádriceps',[['Prensa',80,'3×10-12'],['Sentadilla hack','Actual','3×10-12'],['Extensión cuádriceps',55,'3×12-15'],['Curl femoral',45,'3×11-13']]],['Tracciones',[['Jalón al pecho',45,'3×10-12'],['Remo',30,'3×11-13'],['Curl muñeca supino',10,'3×15-17']]],['Pierna · glúteo/isquios',[['Hip thrust',70,'3×10-12'],['Sentadilla hack','Actual','3×10-12'],['Peso muerto rumano',60,'3×10-12'],['Abducciones','Actual','3×12-15']]],['Torso y brazo',[['Press inclinado máquina',40,'3×10-12'],['Remo mancuerna',22,'3×11-13'],['Fondos','Corporal','3×8-10'],['Elevación lateral polea','Actual','3×12-14'],['Curl predicador',12.5,'3×12-14'],['Pájaros mancuerna',8,'2×13-15'],['Curl muñeca prono',10,'3×15-17']]]];let cur=0;const tabs=document.querySelector('#tabs'),list=document.querySelector('#list');function render(){tabs.innerHTML=days.map((d,i)=>`<button onclick="cur=${i};render()">${i+1}. ${d[0]}</button>`).join('');list.innerHTML=`<div class="card"><b>${days[cur][0]}</b><div class="muted">Registra kg, reps y RIR. En pierna prioriza tolerancia de rodilla.</div></div>`+days[cur][1].map((e,i)=>`<div class="card"><h3>${e[0]}</h3><p><b>${e[1]} kg</b> · ${e[2]} · RIR 2-3</p><label>Reps <input inputmode="numeric" data-k="${cur}-${i}-r"></label> <label>RIR <input inputmode="numeric" data-k="${cur}-${i}-i"></label></div>`).join('');document.querySelectorAll('input').forEach(x=>{x.value=localStorage.getItem(x.dataset.k)||'';x.oninput=()=>localStorage.setItem(x.dataset.k,x.value)})}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
