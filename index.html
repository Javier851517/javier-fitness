<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102746"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="assets/icon-192.png"><title>Javier Fitness V2</title><style>
:root{--navy:#102746;--coral:#ef5b5b;--bg:#f3f5f8;--card:#fff;--muted:#6f7885;--green:#138a5b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17202d}header{position:sticky;top:0;z-index:5;background:var(--navy);color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:850px;margin:auto}.brand{font-weight:900;font-size:20px}.small{font-size:12px;color:#dce5f1}.badge{background:#ffffff20;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 14px;background:white;border-bottom:1px solid #dde2e8;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid #dce1e7;background:white;border-radius:12px;padding:9px 12px;font-weight:800;color:var(--navy)}.tabs button.active{background:var(--coral);border-color:var(--coral);color:white}main{max-width:850px;margin:auto;padding:12px}.hero,.card,.summary{background:var(--card);border-radius:17px;box-shadow:0 2px 12px #10274612;margin-bottom:12px;overflow:hidden}.hero img{width:100%;display:block;max-height:560px;object-fit:contain;background:white}.heroBody{padding:14px}.hero h2{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.card{padding:14px}.exTop{display:flex;justify-content:space-between;gap:10px}.exTop h3{margin:0;font-size:16px}.target{color:var(--coral);font-weight:900;font-size:13px;text-align:right}.rule{background:#fff1f1;color:#a63f43;border-radius:10px;padding:9px;margin:10px 0;font-size:12px}.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr 39px;gap:6px;align-items:center}.sets .lab{text-align:center;color:var(--muted);font-size:10px;font-weight:800}.sets input{width:100%;min-width:0;border:1px solid #dbe0e6;border-radius:9px;padding:10px 4px;text-align:center;font-size:14px}.setno{font-weight:900;text-align:center}.done{width:34px;height:34px;border-radius:50%;border:1px solid #d4dbe3;background:white;color:white;font-weight:900}.done.on{background:var(--green);border-color:var(--green)}.tools{display:flex;gap:8px;margin-top:12px}.timer,.secondary,.primary{border:0;border-radius:11px;padding:11px 12px;font-weight:900}.timer,.primary{background:var(--coral);color:white}.secondary{background:#e8edf3;color:var(--navy)}.summary{padding:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary input,.summary select{width:100%;border:1px solid #dbe0e6;border-radius:9px;padding:10px}.pain{background:#fff4e9;padding:10px;border-radius:11px;margin-top:10px}.alert{display:none;color:#9f3838;background:#ffe8e8;padding:10px;border-radius:9px;margin-top:8px;font-size:12px}.footerBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.progress{height:7px;background:#ffffff30;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#67d2a4;width:0}.toast{position:sticky;bottom:10px;background:var(--navy);color:white;text-align:center;padding:10px;border-radius:11px;display:none}@media(max-width:450px){.hero img{max-height:425px}.sets{grid-template-columns:25px repeat(3,minmax(48px,1fr)) 35px}.card{padding:12px}.grid2{grid-template-columns:1fr}}
</style></head><body><header><div class="top"><div><div class="brand">Javier Fitness V2</div><div class="small">Semana 1 · calibración · 5 × 60 min</div></div><div class="badge" id="weekStatus">0/5 sesiones</div></div><div class="progress"><i id="weekBar"></i></div></header><nav class="tabs" id="tabs"></nav><main><section class="hero"><img id="guide" alt="Guía visual de la sesión"><div class="heroBody"><h2 id="dayName"></h2><div class="muted" id="dayGoal"></div></div></section><div id="cards"></div><section class="summary"><h3>Control de sesión</h3><div class="grid2"><label>RPE global<input id="rpe" type="number" min="1" max="10" value="6"></label><label>Duración (min)<input id="duration" type="number" min="10" max="180" value="60"></label></div><div id="painBox" class="pain"><b>Rodilla derecha · dolor 0-10</b><div class="grid2"><label>Durante<input id="painDuring" type="number" min="0" max="10" value="0"></label><label>Después<input id="painAfter" type="number" min="0" max="10" value="0"></label></div><div class="alert" id="painAlert">No progreses carga. Reduce rango o detén el ejercicio si el dolor aumenta, es agudo o persiste; consulta con fisioterapia si aparece inflamación, bloqueo o empeoramiento.</div></div><div class="footerBtns"><button class="primary" id="finish">Completar sesión</button><button class="secondary" id="reset">Reiniciar</button><button class="secondary" id="export">Exportar copia</button><button class="secondary" id="importBtn">Importar copia</button><input id="importFile" type="file" accept="application/json" hidden></div></section><div class="toast" id="toast" aria-live="polite"></div></main><script>
const days=[{"name": "Empujes", "goal": "Técnica limpia · RIR 2-3 · sin fallo", "image": "assets/sesion-1.png", "knee": false, "ex": [["Press de banca", 40, "kg", 3, "10-12", 2, 120, "12/12/12 con RIR ≥2"], ["Press de pecho en máquina", "", "kg", 3, "10-12", 2, 90, "Completa 12/12/12 antes de subir"], ["Press de hombro sentado", "", "kg", 3, "10-12", 2, 90, "Sin arquear la zona lumbar"], ["Elevaciones laterales", "", "kg", 3, "12-15", 2, 60, "15/15/15 con control"], ["Extensión de tríceps en polea", "", "kg", 3, "12-15", 2, 60, "Codos estables"]]}, {"name": "Pierna · cuádriceps", "goal": "Calibración y tolerancia de rodilla derecha", "image": "assets/sesion-2.png", "knee": true, "ex": [["Prensa inclinada", 80, "kg", 3, "10-12", 3, 120, "No progresar hasta comprobar respuesta 24 h"], ["Sentadilla Hack", "", "kg", 3, "10-12", 3, 120, "Rango tolerable, sin forzar profundidad"], ["Extensión de cuádriceps", 55, "kg", 3, "12-15", 3, 75, "Control lento; detén si aumenta el dolor"], ["Curl femoral", 45, "kg", 3, "11-13", 2, 75, "Pelvis estable"], ["Elevación de gemelos", "", "kg", 3, "12-15", 2, 75, "Pausa arriba y abajo"], ["Crunch abdominal en máquina", "", "kg", 3, "12-15", 2, 60, "Controla la flexión"]]}, {"name": "Tracciones", "goal": "Espalda, bíceps y antebrazo", "image": "assets/sesion-3.png", "knee": false, "ex": [["Jalón al pecho", 45, "kg", 3, "10-12", 2, 90, "12/12/12 limpio antes de subir"], ["Remo sentado", 30, "kg", 3, "11-13", 2, 90, "13/13/13 sin balanceo"], ["Remo complementario", "", "kg", 3, "10-12", 2, 90, "Patrón diferente al primer remo"], ["Curl de bíceps", "", "kg", 3, "10-12", 2, 75, "Sin impulso"], ["Curl martillo", "", "kg", 2, "12-15", 2, 60, "Bajada controlada"], ["Curl de muñeca supino", 10, "kg", 3, "15-17", 2, 60, "Solo se mueve la muñeca"]]}, {"name": "Pierna · glúteo/isquios", "goal": "Cadena posterior con control de rodilla", "image": "assets/sesion-4.png", "knee": true, "ex": [["Hip thrust", 70, "kg", 3, "10-12", 2, 120, "12/12/12 con RIR ≥2"], ["Sentadilla Hack", "", "kg", 3, "10-12", 3, 120, "Rango tolerable"], ["Peso muerto rumano", 60, "kg", 3, "10-12", 2, 120, "Cadera atrás y espalda neutra"], ["Abducción de cadera", "", "kg", 3, "12-15", 2, 60, "Pausa en apertura"], ["Crunch abdominal en máquina", "", "kg", 3, "12-15", 2, 60, "Sin tirar con los brazos"]]}, {"name": "Torso y brazo", "goal": "Volumen complementario y progresión técnica", "image": "assets/sesion-5.png", "knee": false, "ex": [["Press inclinado en máquina", 40, "kg", 3, "10-12", 2, 120, "12/12/12 con RIR 2-3"], ["Remo con mancuerna", 22, "kg/lado", 3, "11-13", 2, 90, "13/13/13 con técnica limpia"], ["Fondos en paralelas", "Corporal", "", 3, "8-10", 2, 90, "10/10/10 antes de añadir lastre"], ["Elevación lateral unilateral en polea", "", "kg", 3, "12-14", 2, 60, "14/14/14 sin elevar hombro"], ["Curl predicador en máquina", 12.5, "kg", 3, "12-14", 2, 75, "14/14/14 antes de subir"], ["Pájaros con mancuernas", 8, "kg/lado", 2, "13-15", 2, 60, "15/15 limpios"], ["Curl de muñeca prono", 10, "kg", 3, "15-17", 2, 60, "Movimiento exclusivo de muñeca"]]}];let cur=0;const key='javierFitnessV2';let state=JSON.parse(localStorage.getItem(key)||'null')||days.map(d=>({done:false,rpe:6,duration:60,pain:[0,0],sets:d.ex.map(e=>Array.from({length:e[3]},()=>({w:e[1],r:'',rir:'',ok:false})))}));const $=s=>document.querySelector(s);function save(){localStorage.setItem(key,JSON.stringify(state));update()}function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}function render(){const d=days[cur],s=state[cur];$('#tabs').innerHTML=days.map((x,i)=>`<button class="${i===cur?'active':''}" data-i="${i}">${i+1}. ${x.name}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});$('#guide').src=d.image;$('#guide').alt='Guía visual '+d.name;$('#dayName').textContent='Sesión '+(cur+1)+' · '+d.name;$('#dayGoal').textContent=d.goal;$('#painBox').style.display=d.knee?'block':'none';$('#rpe').value=s.rpe;$('#duration').value=s.duration;$('#painDuring').value=s.pain[0];$('#painAfter').value=s.pain[1];$('#cards').innerHTML=d.ex.map((e,ei)=>`<article class="card"><div class="exTop"><h3>${ei+1}. ${e[0]}</h3><div class="target">${e[3]} × ${e[4]}<br>RIR ${e[5]} · ${e[6]}s</div></div><div class="rule">Progresión: ${e[7]}</div><div class="sets"><span></span><span class="lab">CARGA</span><span class="lab">REPS</span><span class="lab">RIR</span><span></span>${s.sets[ei].map((v,si)=>`<span class="setno">${si+1}</span><input data-e="${ei}" data-s="${si}" data-k="w" value="${v.w}" aria-label="Carga serie ${si+1}"><input data-e="${ei}" data-s="${si}" data-k="r" value="${v.r}" inputmode="numeric" placeholder="${e[4]}" aria-label="Repeticiones serie ${si+1}"><input data-e="${ei}" data-s="${si}" data-k="rir" value="${v.rir}" inputmode="numeric" placeholder="${e[5]}" aria-label="RIR serie ${si+1}"><button class="done ${v.ok?'on':''}" data-ok="${ei}-${si}" aria-label="Completar serie">✓</button>`).join('')}</div><div class="tools"><button class="timer" data-sec="${e[6]}">Descanso ${e[6]}s</button></div></article>`).join('');document.querySelectorAll('.sets input').forEach(i=>i.oninput=()=>{state[cur].sets[+i.dataset.e][+i.dataset.s][i.dataset.k]=i.value;save()});document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{let [e,sx]=b.dataset.ok.split('-').map(Number);state[cur].sets[e][sx].ok=!state[cur].sets[e][sx].ok;save();render()});document.querySelectorAll('.timer').forEach(b=>b.onclick=()=>startTimer(b,+b.dataset.sec));painCheck();update()}function startTimer(btn,sec){let left=sec;btn.disabled=true;const original=btn.textContent;const id=setInterval(()=>{left--;btn.textContent=`Descanso ${left}s`;if(left<=0){clearInterval(id);btn.disabled=false;btn.textContent=original;toast('Descanso terminado')}} ,1000)}function painCheck(){let p=Math.max(+$('#painDuring').value||0,+$('#painAfter').value||0);$('#painAlert').style.display=p>=4?'block':'none'}function update(){const count=state.filter(x=>x.done).length;$('#weekStatus').textContent=`${count}/5 sesiones`;$('#weekBar').style.width=(count/5*100)+'%'}$('#rpe').oninput=e=>{state[cur].rpe=Math.max(1,Math.min(10,+e.target.value||1));save()};$('#duration').oninput=e=>{state[cur].duration=Math.max(10,Math.min(180,+e.target.value||60));save()};['painDuring','painAfter'].forEach((id,i)=>$('#'+id).oninput=e=>{state[cur].pain[i]=Math.max(0,Math.min(10,+e.target.value||0));save();painCheck()});$('#finish').onclick=()=>{state[cur].done=!state[cur].done;save();toast(state[cur].done?'Sesión completada':'Sesión marcada pendiente')};$('#reset').onclick=()=>{state[cur].sets.forEach((a,ei)=>a.forEach((x,si)=>{x.r='';x.rir='';x.ok=false;x.w=days[cur].ex[ei][1]}));state[cur].done=false;state[cur].pain=[0,0];save();render();toast('Sesión reiniciada')};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='javier-fitness-copia.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x)||x.length!==days.length)throw 0;state=x;save();render();toast('Copia restaurada')}catch{toast('Archivo de copia no válido')}};r.readAsText(f)};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
