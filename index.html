<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102746"><link rel="manifest" href="manifest.json"><title>Javier Fitness V3.2</title><style>:root{--navy:#102746;--coral:#ef5b5b;--green:#25c46a;--green2:#eafaf0;--bg:#f2f4f7;--muted:#79818c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182230}header{background:white;padding:16px;position:sticky;top:0;z-index:4;border-bottom:1px solid #e3e7ec}.head{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center}.title{font-weight:900}.week{font-size:12px;color:var(--muted)}.pill{background:#dbf8e7;color:#178a49;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.bar{height:4px;background:#e5e8ec;margin-top:12px}.bar i{display:block;height:100%;background:var(--green);width:0}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 12px;background:white}.tabs button{border:1px solid #dae0e6;background:white;color:var(--navy);padding:9px 11px;border-radius:11px;font-weight:800;white-space:nowrap}.tabs button.on{background:var(--navy);color:white}main{max-width:760px;margin:auto;padding:12px}.session{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 12px}.session h2{font-size:17px;margin:0}.session span{font-size:12px;color:var(--muted)}.exercise{background:white;border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 2px 10px #10274610;border:2px solid transparent;transition:.2s}.exercise.started{border-color:#ff9a9a;background:#fffafa;box-shadow:0 3px 14px #ef5b5b28}.exercise.complete{border-color:var(--green);background:var(--green2);box-shadow:0 3px 16px #25c46a33}.row{display:flex;gap:11px;align-items:center}.pic{width:72px;height:72px;border-radius:11px;background:#eef1f4;display:grid;place-items:center;overflow:hidden;flex:0 0 72px}.pic img{width:100%;height:100%;object-fit:cover;display:block}.info{flex:1;min-width:0}.name{font-weight:900;font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.count{font-size:11px;font-weight:900;color:var(--muted)}.mini{height:4px;background:#e9ecf0;border-radius:5px;margin:10px 0 12px;overflow:hidden}.mini i{display:block;height:100%;width:0;background:#efb0b0}.started .mini i{background:var(--coral)}.complete .mini i{background:var(--green)}.sets{display:grid;grid-template-columns:26px 1fr 1fr 1fr 36px;gap:6px;align-items:center}.lab{text-align:center;font-size:9px;color:var(--muted);font-weight:800}.sets input{width:100%;min-width:0;border:1px solid #dce1e6;border-radius:8px;padding:9px 3px;text-align:center}.num{text-align:center;font-weight:900}.check{width:32px;height:32px;border-radius:50%;border:1px solid #d4dae1;background:white;color:#fff}.check.on{background:var(--coral);border-color:var(--coral)}.complete .check.on{background:var(--green);border-color:var(--green)}.summary{background:white;border-radius:15px;padding:14px;margin-top:14px}.summary input{width:72px;padding:8px;border:1px solid #dce1e6;border-radius:8px}.finish{width:100%;margin-top:12px;border:0;border-radius:11px;background:var(--navy);color:white;padding:13px;font-weight:900}@media(max-width:380px){.pic{width:62px;height:62px;flex-basis:62px}.sets{grid-template-columns:23px repeat(3,minmax(44px,1fr)) 33px}}</style></head><body><header><div class="head"><div><div class="title">Javier Fitness V3.2</div><div class="week">Semana 1 · progresión visual</div></div><div class="pill" id="status">0/5 sesiones</div></div><div class="bar"><i id="bar"></i></div></header><nav class="tabs" id="tabs"></nav><main><div class="session"><div><h2 id="day"></h2><span id="goal"></span></div><b id="series"></b></div><div id="list"></div><div class="summary"><b>Control de sesión</b><p>RPE <input id="rpe" type="number" min="1" max="10" value="6"> &nbsp; Min <input id="min" type="number" min="10" max="180" value="60"></p><button class="finish" id="finish">Completar entrenamiento</button></div></main><script>
const pics={'Press de banca':'press-banca','Press pecho máquina':'press-pecho-maquina','Press hombro':'press-hombro','Elevaciones laterales':'elevaciones-laterales','Extensión tríceps polea':'triceps-polea','Prensa':'prensa','Sentadilla hack':'hack-1','Extensión cuádriceps':'extension-cuadriceps','Curl femoral':'curl-femoral','Gemelos':'gemelos','Core':'crunch-1','Jalón al pecho':'jalon','Remo':'remo-sentado','Remo complementario':'remo-maquina','Curl bíceps':'curl-biceps','Curl martillo':'curl-martillo','Curl muñeca supino':'wrist-supino','Hip thrust':'hip-thrust','Peso muerto rumano':'rumano','Abducción cadera':'abduccion','Crunch máquina':'crunch-2','Press inclinado máquina':'press-inclinado','Remo mancuerna':'remo-mancuerna','Fondos':'fondos','Elevación lateral polea':'lateral-polea','Curl predicador':'curl-predicador','Pájaros mancuerna':'pajaros','Curl muñeca prono':'wrist-prono'};const days=[['Empujes','Técnica limpia · RIR 2-3',[['Press de banca',40,3,'10-12',120],['Press pecho máquina','Actual',3,'10-12',90],['Press hombro','Actual',3,'10-12',90],['Elevaciones laterales','Actual',3,'12-15',60],['Extensión tríceps polea','Actual',3,'12-15',60]]],['Pierna · cuádriceps','Prioridad: tolerancia rodilla derecha',[['Prensa',80,3,'10-12',120],['Sentadilla hack','Actual',3,'10-12',120],['Extensión cuádriceps',55,3,'12-15',75],['Curl femoral',45,3,'11-13',75],['Gemelos','Actual',3,'12-15',75],['Core','Actual',3,'12-15',60]]],['Tracciones','Espalda, bíceps y antebrazo',[['Jalón al pecho',45,3,'10-12',90],['Remo',30,3,'11-13',90],['Remo complementario','Actual',3,'10-12',90],['Curl bíceps','Actual',3,'10-12',75],['Curl martillo','Actual',2,'12-15',60],['Curl muñeca supino',10,3,'15-17',60]]],['Pierna · glúteo/isquios','Cadena posterior · control de rodilla',[['Hip thrust',70,3,'10-12',120],['Sentadilla hack','Actual',3,'10-12',120],['Peso muerto rumano',60,3,'10-12',120],['Abducción cadera','Actual',3,'12-15',60],['Crunch máquina','Actual',3,'12-15',60]]],['Torso y brazo','Volumen complementario',[['Press inclinado máquina',40,3,'10-12',120],['Remo mancuerna',22,3,'11-13',90],['Fondos','Corporal',3,'8-10',90],['Elevación lateral polea','Actual',3,'12-14',60],['Curl predicador',12.5,3,'12-14',75],['Pájaros mancuerna',8,2,'13-15',60],['Curl muñeca prono',10,3,'15-17',60]]]];let cur=0,K='javierFitnessV3';let st=JSON.parse(localStorage.getItem(K)||'null')||days.map(d=>({done:false,rpe:6,min:60,ex:d[2].map(e=>Array.from({length:e[2]},()=>({w:e[1],r:'',rir:'',ok:false})))}));const $=s=>document.querySelector(s);function save(){localStorage.setItem(K,JSON.stringify(st));update()}function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}function render(){let d=days[cur],s=st[cur];$('#tabs').innerHTML=days.map((x,i)=>`<button data-i="${i}" class="${i===cur?'on':''}">${i+1}. ${x[0]}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});$('#day').textContent='Sesión '+(cur+1)+' · '+d[0];$('#goal').textContent=d[1];$('#rpe').value=s.rpe;$('#min').value=s.min;$('#list').innerHTML=d[2].map((e,ei)=>{let sets=s.ex[ei],n=sets.filter(x=>x.ok).length,started=sets.some(x=>x.ok||x.r!==''||x.rir!==''||String(x.w)!==String(e[1])),cls=n===sets.length?'complete':started?'started':'';return `<article class="exercise ${cls}"><div class="row"><div class="pic"><img src="./assets/exercises/${pics[e[0]]||'movilidad'}.jpg" alt="${e[0]}" onerror="this.style.display='none';this.parentElement.textContent='🏋️'"></div><div class="info"><div class="name">${e[0]}</div><div class="meta">${e[2]} series · ${e[3]} reps · RIR 2-3 · ${e[4]}s</div></div><div class="count">${n}/${sets.length}</div></div><div class="mini"><i style="width:${n/sets.length*100}%"></i></div><div class="sets"><span></span><span class="lab">CARGA</span><span class="lab">REPS</span><span class="lab">RIR</span><span></span>${sets.map((x,si)=>`<span class="num">${si+1}</span><input data-e="${ei}" data-s="${si}" data-k="w" value="${esc(x.w)}"><input data-e="${ei}" data-s="${si}" data-k="r" value="${esc(x.r)}" inputmode="numeric"><input data-e="${ei}" data-s="${si}" data-k="rir" value="${esc(x.rir)}" inputmode="numeric"><button class="check ${x.ok?'on':''}" data-ok="${ei}-${si}">✓</button>`).join('')}</div></article>`}).join('');document.querySelectorAll('.sets input').forEach(i=>i.onchange=()=>{const row=st[cur].ex[+i.dataset.e][+i.dataset.s];row[i.dataset.k]=i.value;row.ok=String(row.r).trim()!==''&&String(row.rir).trim()!=='';save();render()});document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{let [e,si]=b.dataset.ok.split('-').map(Number),row=st[cur].ex[e][si];row.ok=String(row.r).trim()!==''&&String(row.rir).trim()!=='';save();render()});update()}function update(){let s=st[cur],all=s.ex.flat(),n=all.filter(x=>x.ok).length;$('#series').textContent=n+'/'+all.length+' series';let c=st.filter(x=>x.done).length;$('#status').textContent=c+'/5 sesiones';$('#bar').style.width=c/5*100+'%'}$('#rpe').oninput=e=>{st[cur].rpe=e.target.value;save()};$('#min').oninput=e=>{st[cur].min=e.target.value;save()};$('#finish').onclick=()=>{st[cur].done=!st[cur].done;save();render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
